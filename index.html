<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Singlish, lah. — 日本人駐在員のためのシングリッシュ用語集</title>
<meta name="description" content="シンガポールで暮らす・働く日本人駐在員向けの、実用シングリッシュ用語集。日常会話やビジネスの現場で聞いた表現をやさしい日本語で解説。">
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>Singlish, <span class="accent">lah.</span></h1>
      <p class="tagline">日本人駐在員のための、実用シングリッシュ用語集</p>
    </div>
  </header>

  <main class="wrap">
    <section class="intro">
      <p>
        シンガポールで暮らしていると、英語のはずなのに聞き取れない・意味がわからない表現によく出会います。
        これは、その場その場で調べて理解してきた表現を少しずつ溜めている個人用語集です。
        <br>
        <span class="badge">📍 personal</span> は、実際の会話の中で遭遇して意味を調べた表現です。
      </p>
    </section>

    <section class="controls">
      <input type="search" id="search" placeholder="🔍 用語やカテゴリで検索 (例: lah, 食, 仕事)" autocomplete="off">
      <div id="category-filters" class="filters"></div>
    </section>

    <section id="results-info" class="results-info"></section>

    <section id="term-list" class="term-list"></section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>ニッチすぎて誰得だけど、自分用に作ったのでついでに公開してます。新しい表現に出会ったら随時追加していきます。</p>
      <p><a href="https://github.com/taikiito-dev/singlish-lah">GitHub でソースを見る</a></p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
